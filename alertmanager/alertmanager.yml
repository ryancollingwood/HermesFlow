# =============================================================================
#  Alertmanager config — routes alerts fired by prometheus/alert.rules.yml.
#  Like the Caddyfile, this is edited directly rather than templated from
#  .env — there's no real notification channel configured by default, so
#  alerts are visible in the Alertmanager UI (http://alertmanager.localhost)
#  but go nowhere until you add a real receiver below.
# =============================================================================

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # No-op by default. Replace with a real receiver, e.g.:
  #
  #   - name: default
  #     slack_configs:
  #       - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
  #         channel: '#alerts'
  #
  #   - name: default
  #     email_configs:
  #       - to: you@example.com
  #         from: alertmanager@yourdomain.com
  #         smarthost: smtp.yourdomain.com:587
  #         auth_username: alertmanager@yourdomain.com
  #         auth_password: <app-password>
  - name: default
