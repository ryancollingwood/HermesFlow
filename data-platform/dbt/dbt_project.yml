name: data_platform
version: "1.0.0"
config-version: 2

profile: data_platform

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  data_platform:
    staging:
      +materialized: table
      +schema: stg
    marts:
      +materialized: table
      # Routed to the attached Postgres database — see profiles.yml `attach`
      # and docs/plans/datalake.md "dbt-duckdb <-> Postgres bridge".
      +database: pg
      +schema: data_platform
