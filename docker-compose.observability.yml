# =============================================================================
#  Observability — Prometheus + Grafana + exporters + Loki/Promtail
#
#  Opt-in override layered on top of the base stack via COMPOSE_FILE in .env:
#      COMPOSE_FILE=docker-compose.yml:docker-compose.observability.yml
#  The installer does this with `--with-observability`; manually, run
#  `make observability`. Docker Compose reads COMPOSE_FILE from .env, so every
#  `docker compose` / `make` call then includes these services. Prefer this
#  over editing the base file.
#
#  These services join networks (`monitoring`, `backend`, `collection`,
#  `memory`, `edge`) declared in the base `docker-compose.yml` — this file
#  is not meant to be run standalone.
#
#  Dashboards at http://grafana.localhost (admin / see GRAFANA_ADMIN_PASSWORD)
#  Raw metrics at http://prometheus.localhost
#
#  Recommended community dashboard IDs to import in Grafana:
#    193  — cAdvisor (container metrics)
#    1860 — Node Exporter Full (host metrics)
#    9628 — PostgreSQL Database
#
#  NOTE: YAML anchors are file-scoped — the base file's &default-logging is not
#  visible here, so it is redefined below.
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  # Restores caddy's wait-for-alertmanager dependency, dropped from the base
  # file since alertmanager only exists when this override is loaded.
  caddy:
    depends_on:
      alertmanager:
        condition: service_started

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/prometheus:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks: [monitoring, edge]
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-latest}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.localhost
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [monitoring, edge]
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-latest}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --disable_metrics=advtcp,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
    networks: [monitoring]
    logging: *default-logging

  node_exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-latest}
    container_name: node_exporter
    restart: unless-stopped
    command:
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.diskstats
      - --collector.filesystem
      - --collector.loadavg
      - --collector.meminfo
      - --collector.netdev
      - --collector.textfile
      - --collector.textfile.directory=/shared/metrics
      - --collector.uname
    volumes:
      # HF-033 writes one replace-in-place current-state snapshot here from
      # Windmill. This is not a second log store or an append-only history.
      - ${SHARED_DIR:-./data/shared}:/shared:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [monitoring]
    logging: *default-logging

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-latest}
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${WM_DB_PASSWORD:-windmill}@db/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [backend, monitoring]
    logging: *default-logging

  collection_postgres_exporter:
    image: prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-latest}
    container_name: collection_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${COLLECTION_DB_ADMIN_USER:-collection_admin}:${COLLECTION_DB_ADMIN_PASSWORD:-collection}@collection_db:5432/${COLLECTION_DB_NAME:-collection}?sslmode=disable
    depends_on:
      collection_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [collection, monitoring]
    logging: *default-logging

  hindsight_postgres_exporter:
    image: prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-latest}
    container_name: hindsight_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${HINDSIGHT_DB_USER:-hindsight}:${HINDSIGHT_DB_PASSWORD:-hindsight}@hindsight_db:5432/${HINDSIGHT_DB_NAME:-hindsight}?sslmode=disable
    depends_on:
      hindsight_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [memory, monitoring]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Alertmanager — receives alerts fired by prometheus/alert.rules.yml and
  #  routes them to a notification channel (none configured by default — see
  #  alertmanager/alertmanager.yml). UI at http://alertmanager.localhost.
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-latest}
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/alertmanager:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    networks: [monitoring, edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Loki — log storage. Filesystem-backed, single-binary mode. Retention is
  #  set via LOKI_RETENTION_PERIOD in .env (see loki/loki-config.yml). Queried
  #  from Grafana's Explore tab via the Loki datasource — no Caddy route,
  #  nothing here is meant to be browsed directly.
  #  No healthcheck: the image is distroless (no shell/wget/curl), so an
  #  HTTP-based check can never succeed. Promtail depends on service_started
  #  only and retries pushes on its own until Loki's ingester is ready.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-latest}
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-720h}
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/loki:/loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks: [monitoring]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Promtail — discovers every running container via the Docker socket and
  #  ships its logs to Loki. No log-dir bind mount needed (Docker SD reads via
  #  the daemon API), but it does need read access to the socket itself.
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-latest}
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    networks: [monitoring]
    logging: *default-logging
