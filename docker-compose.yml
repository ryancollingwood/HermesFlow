# =============================================================================
#  Hermes Agent + Windmill + Hindsight memory — consolidated stack
#  - Caddy front door (single ingress, optional TLS)
#  - Windmill LSP for editor intellisense
#  - Hindsight (personal second-brain memory) — single container, embedded PG
#  - Healthchecks where they're meaningful
#  - Resource limits on the privileged workers
#  - Light network segmentation (db not reachable from the edge)
#  NOTE: the obsolete top-level `version:` key has been removed (Compose v2).
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

# Shared base for the Windmill app image so the worker definitions stay DRY
x-windmill-image: &wm-image ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:main}

networks:
  # db <-> windmill server/workers. Not exposed to Hermes or the proxy.
  backend:
  # caddy <-> the things it needs to reach (server, lsp, hermes, ollama)
  edge:
  # windmill server/workers <-> hermes gateway API (OpenAI-compatible endpoint)
  agent:
  # hindsight <-> hermes (memory layer, isolated from edge)
  memory:
  # ollama <-> hermes, hindsight, windmill workers (local LLM inference layer)
  inference:
  # prometheus + exporters + grafana (scraping stays off the application networks)
  monitoring:

services:
  # ---------------------------------------------------------------------------
  #  Reverse proxy / single ingress
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-./data/caddy/data}:/data
      - ${CADDY_CONFIG_DIR:-./data/caddy/config}:/config
    depends_on:
      # service_started (not _healthy) so a flaky app healthcheck never blocks ingress
      windmill_server:
        condition: service_started
      windmill_lsp:
        condition: service_started
      hermes:
        condition: service_started
      ollama:
        condition: service_started
    networks: [edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Hermes Agent — gateway + built-in dashboard (ONE container)
  #  All state (config, .env, sessions, memory, skills) lives under /opt/data.
  #  The dashboard is a supervised s6 service inside this container, toggled by
  #  HERMES_DASHBOARD=1 and served on 9119 — it CANNOT be a separate container
  #  (its liveness check needs a shared PID namespace with the gateway).
  #  No `init:` — the image runs s6-overlay as PID 1 (reaps + forwards signals).
  # ---------------------------------------------------------------------------
  hermes:
    image: nousresearch/hermes-agent:${HERMES_VERSION:-latest}
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      # HERMES_BIND defaults to localhost. Set it to 0.0.0.0 (or empty) for LAN
      # access — but with HERMES_DASHBOARD_INSECURE=1 the dashboard exposes API
      # keys + session data to anyone who can reach 9119, so only do that on a
      # trusted LAN or behind Caddy.
      - "${HERMES_BIND:-127.0.0.1}:${API_SERVER_PORT:-8642}:8642"        # gateway API + health
      - "${HERMES_BIND:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"  # dashboard
    environment:
      # Map the container's hermes user to your host UID/GID so it can write to
      # the bind-mounted /opt/data (PUID/PGID are accepted aliases).
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      # Dashboard
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      - HERMES_DASHBOARD_HOST=${HERMES_DASHBOARD_HOST:-0.0.0.0}
      - HERMES_DASHBOARD_PORT=${HERMES_DASHBOARD_PORT:-9119}
      - HERMES_DASHBOARD_INSECURE=${HERMES_DASHBOARD_INSECURE:-}
      # OpenAI-compatible API server. Needed for the dashboard / external tools
      # (e.g. Windmill) to reach the gateway. If enabled, API_SERVER_KEY must be
      # >= 8 chars — generate with: openssl rand -hex 32
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-false}
      - API_SERVER_HOST=${API_SERVER_HOST:-0.0.0.0}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      # Provider keys / bot tokens: by default these come from the wizard-written
      # /opt/data/.env. Uncomment to forward from the top-level .env INSTEAD —
      # but a direct value (even empty) OVERRIDES /opt/data/.env, so uncomment if setting a value
      # - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Hindsight memory plugin — forwarded so the plugin can reach the API
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - HINDSIGHT_BASE_URL=${HINDSIGHT_BASE_URL:-http://hindsight:8888}
    volumes:
      - ${DATA_DIR:-./data/hermes}:/opt/data
      - ${SHARED_DIR:-./data/shared}:/shared
    shm_size: 1g   # Playwright/Chromium browser tools need shared memory
    # Health endpoint lives on the API server (API_SERVER_ENABLED=true). If this
    # returns 401/404 on your version, switch to the authenticated probe below.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8642/health"]
      # Authenticated alternative (uses the in-container API key):
      # test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$API_SERVER_KEY\" http://localhost:8642/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEM_LIMIT:-2G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"
    networks: [edge, agent, memory, inference]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Hindsight — personal second-brain memory
  #  Single container with embedded PostgreSQL + pgvector. No external DB needed.
  #  API on 8888, web UI (memory browser) on 9999.
  #  LLM is used for fact extraction and reflect synthesis — points at LM Studio.
  # ---------------------------------------------------------------------------
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    environment:
      # LLM for memory extraction and synthesis.
      # Defaults to the Ollama container; override to use LM Studio or a remote API.
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_LLM_API_KEY:-ollama}
      - HINDSIGHT_API_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL:-http://ollama:11434/v1}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL:-llama3.2:3b}
      # Optional API key to protect the Hindsight endpoint (leave blank for local-only)
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - HINDSIGHT_API_LLM_TIMEOUT=${HINDSIGHT_LLM_TIMEOUT:-}
      - HINDSIGHT_API_LOG_LEVEL=DEBUG
      - HINDSIGHT_API_LLM_RESPONSE_FORMAT=${HINDSIGHT_LLM_RESPONSE_FORMAT:-json_schema}
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER:-ollama}
    volumes:
      - ${HINDSIGHT_DATA_DIR:-C:/Containers/hindsight}:/home/hindsight/.pg0
    ports:
      - "${HINDSIGHT_BIND:-127.0.0.1}:${HINDSIGHT_API_PORT:-8888}:8888"   # REST API
      - "${HINDSIGHT_BIND:-127.0.0.1}:${HINDSIGHT_UI_PORT:-9999}:9999"    # Web UI
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach LM Studio on the host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${HINDSIGHT_MEM_LIMIT:-2G}
          cpus: "${HINDSIGHT_CPU_LIMIT:-1.0}"
    networks: [memory, inference]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Ollama — local LLM inference server (OpenAI-compatible API at /v1)
  #  Models are stored in OLLAMA_DATA_DIR (can be several GB each).
  #  Pull a model after first start:
  #    docker exec ollama ollama pull llama3.2
  #
  #  NVIDIA GPU support: requires nvidia-container-toolkit on the host.
  #  Uncomment the `reservations` block under deploy.resources and restart.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      # Listen on all interfaces so Docker-networked services can reach it.
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-8}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ${OLLAMA_DATA_DIR:-./data/ollama}:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM_LIMIT:-32G}
          cpus: "${OLLAMA_CPU_LIMIT:-8.0}"
        # Uncomment for NVIDIA GPU support (requires nvidia-container-toolkit):
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]
    networks: [inference, edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: windmill_db
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${WM_DB_PASSWORD:-windmill}
      POSTGRES_DB: windmill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill server
  # ---------------------------------------------------------------------------
  windmill_server:
    image: *wm-image
    pull_policy: always
    container_name: windmill_server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://postgres:${WM_DB_PASSWORD:-windmill}@db/windmill?sslmode=disable
      - MODE=server
      - BASE_URL=${WM_BASE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/logs:/tmp/windmill/logs
      - ${SHARED_DIR:-./data/shared}:/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/version || wget -qO- http://localhost:8000/api/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [backend, edge, agent]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill LSP (editor intellisense — proxied at /ws/*)
  # ---------------------------------------------------------------------------
  windmill_lsp:
    image: ${WM_LSP_IMAGE:-ghcr.io/windmill-labs/windmill-lsp:latest}
    pull_policy: always
    container_name: windmill_lsp
    restart: unless-stopped
    environment:
      - WINDMILL_BASE_URL=http://windmill_server:8000
    volumes:
      - ${WM_LSP_CACHE_DIR:-./data/windmill/lsp_cache}:/pyls/.cache
    networks: [edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill workers (default group) — privileged, so capped
  # ---------------------------------------------------------------------------
  windmill_worker:
    image: *wm-image
    pull_policy: always
    restart: unless-stopped
    privileged: true
    init: true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 512M
    environment:
      - DATABASE_URL=postgres://postgres:${WM_DB_PASSWORD:-windmill}@db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=default
      - FAVOR_UNSHARE_PID=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/cache:/tmp/windmill/cache
      - ${WM_DATA_DIR:-./data/windmill}/logs:/tmp/windmill/logs
      - ${SHARED_DIR:-./data/shared}:/shared
    networks: [backend, agent, inference]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill native worker (lightweight, in-process jobs)
  # ---------------------------------------------------------------------------
  windmill_worker_native:
    image: *wm-image
    pull_policy: always
    container_name: windmill_worker_native
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
        reservations:
          memory: 256M
    environment:
      - DATABASE_URL=postgres://postgres:${WM_DB_PASSWORD:-windmill}@db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=native
      - NATIVE_MODE=true
      - SLEEP_QUEUE=200
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/logs:/tmp/windmill/logs
      - ${SHARED_DIR:-./data/shared}:/shared
    networks: [backend, agent, inference]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Observability — Prometheus + Grafana + exporters
  #
  #  Dashboards at http://grafana.localhost (admin / see GRAFANA_ADMIN_PASSWORD)
  #  Raw metrics at http://prometheus.localhost
  #
  #  Recommended community dashboard IDs to import in Grafana:
  #    193  — cAdvisor (container metrics)
  #    1860 — Node Exporter Full (host metrics)
  #    9628 — PostgreSQL Database
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/prometheus:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks: [monitoring, edge]
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-latest}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.localhost
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [monitoring, edge]
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-latest}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --disable_metrics=advtcp,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
    networks: [monitoring]
    logging: *default-logging

  node_exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-latest}
    container_name: node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.diskstats
      - --collector.filesystem
      - --collector.loadavg
      - --collector.meminfo
      - --collector.netdev
      - --collector.uname
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [monitoring]
    logging: *default-logging

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-latest}
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${WM_DB_PASSWORD:-windmill}@db/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [backend, monitoring]
    logging: *default-logging