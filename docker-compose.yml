# =============================================================================
#  Hermes Agent + Windmill + Hindsight memory — consolidated stack
#  - Caddy front door (single ingress, optional TLS)
#  - Windmill LSP for editor intellisense
#  - Hindsight (personal second-brain memory) — single container, embedded PG
#  - Healthchecks where they're meaningful
#  - Resource limits on the privileged workers
#  - Light network segmentation (db not reachable from the edge)
#  NOTE: the obsolete top-level `version:` key has been removed (Compose v2).
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

# Shared base for the Windmill app image so the worker definitions stay DRY
x-windmill-image: &wm-image ${WM_IMAGE:-ghcr.io/windmill-labs/windmill:main}

networks:
  # db <-> windmill server/workers. Not exposed to Hermes or the proxy.
  backend:
  # caddy <-> the things it needs to reach (server, lsp, hermes, ollama)
  edge:
  # windmill server/workers <-> hermes gateway API (OpenAI-compatible endpoint)
  agent:
  # hindsight <-> hermes (memory layer, isolated from edge)
  memory:
  # ollama <-> hermes, hindsight, windmill workers (local LLM inference layer)
  inference:
  # prometheus + exporters + grafana (scraping stays off the application networks)
  monitoring:

services:
  # ---------------------------------------------------------------------------
  #  Reverse proxy / single ingress
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR:-./data/caddy/data}:/data
      - ${CADDY_CONFIG_DIR:-./data/caddy/config}:/config
    depends_on:
      # service_started (not _healthy) so a flaky app healthcheck never blocks ingress
      windmill_server:
        condition: service_started
      windmill_lsp:
        condition: service_started
      hermes:
        condition: service_started
      ollama:
        condition: service_started
      hindsight:
        condition: service_started
      headroom:
        condition: service_started
      alertmanager:
        condition: service_started
    networks: [edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Hermes Agent — gateway + built-in dashboard (ONE container)
  #  All state (config, .env, sessions, memory, skills) lives under /opt/data.
  #  The dashboard is a supervised s6 service inside this container, toggled by
  #  HERMES_DASHBOARD=1 and served on 9119 — it CANNOT be a separate container
  #  (its liveness check needs a shared PID namespace with the gateway).
  #  No `init:` — the image runs s6-overlay as PID 1 (reaps + forwards signals).
  # ---------------------------------------------------------------------------
  hermes:
    # Thin derived image: bakes extra Python packages (hermes/requirements.txt)
    # into the upstream image's read-only venv at build time. See hermes/README.md.
    # Deploy package changes with: docker compose build hermes && docker compose up -d hermes
    build:
      context: ./hermes
      args:
        HERMES_VERSION: ${HERMES_VERSION:-latest}
    image: hermesflow/hermes:${HERMES_VERSION:-latest}
    container_name: hermes
    restart: unless-stopped
    depends_on:
      headroom:
        condition: service_healthy
    command: gateway run
    ports:
      # HERMES_BIND defaults to localhost. Set it to 0.0.0.0 (or empty) for LAN
      # access — but with HERMES_DASHBOARD_INSECURE=1 the dashboard exposes API
      # keys + session data to anyone who can reach 9119, so only do that on a
      # trusted LAN or behind Caddy.
      - "${HERMES_BIND:-127.0.0.1}:${API_SERVER_PORT:-8642}:8642"        # gateway API + health
      - "${HERMES_BIND:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"  # dashboard
    environment:
      # Map the container's hermes user to your host UID/GID so it can write to
      # the bind-mounted /opt/data (PUID/PGID are accepted aliases).
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      # Dashboard
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      - HERMES_DASHBOARD_HOST=${HERMES_DASHBOARD_HOST:-0.0.0.0}
      - HERMES_DASHBOARD_PORT=${HERMES_DASHBOARD_PORT:-9119}
      - HERMES_DASHBOARD_INSECURE=${HERMES_DASHBOARD_INSECURE:-}
      # OpenAI-compatible API server. Needed for the dashboard / external tools
      # (e.g. Windmill) to reach the gateway. If enabled, API_SERVER_KEY must be
      # >= 8 chars — generate with: openssl rand -hex 32
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-false}
      - API_SERVER_HOST=${API_SERVER_HOST:-0.0.0.0}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      # Provider keys / bot tokens: by default these come from the wizard-written
      # /opt/data/.env. Uncomment to forward from the top-level .env INSTEAD —
      # but a direct value (even empty) OVERRIDES /opt/data/.env, so uncomment if setting a value
      # - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Hindsight memory plugin — forwarded so the plugin can reach the API.
      # The hindsight memory provider (hindsight-client, bundled in the image)
      # reads HINDSIGHT_API_URL; HINDSIGHT_BASE_URL is kept for backwards-compat /
      # docs. Both point at the same internal host.
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - HINDSIGHT_BASE_URL=${HINDSIGHT_BASE_URL:-http://hindsight:8888}
      - HINDSIGHT_API_URL=${HINDSIGHT_BASE_URL:-http://hindsight:8888}
      # Claude Code config dir, explicit even though HOME=/opt/data already
      # resolves there by default — keeps config on the bind-mounted volume
      # so auth/session state survives container rebuilds.
      - CLAUDE_CONFIG_DIR=/opt/data/.claude
    volumes:
      - ${DATA_DIR:-./data/hermes}:/opt/data
      - ${SHARED_DIR:-./data/shared}:/shared
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a host-native MLX server (see mlx/)
    shm_size: 1g   # Playwright/Chromium browser tools need shared memory
    # Health endpoint lives on the API server (API_SERVER_ENABLED=true). If this
    # returns 401/404 on your version, switch to the authenticated probe below.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8642/health"]
      # Authenticated alternative (uses the in-container API key):
      # test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$API_SERVER_KEY\" http://localhost:8642/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEM_LIMIT:-2G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"
    networks: [edge, agent, memory, inference]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Headroom — context optimisation proxy
  #  Transparently compresses Hermes LLM requests before forwarding to the
  #  upstream provider (OpenRouter, etc.). Reachable at http://headroom:8787/v1
  #  from the hermes container (agent net). Caddy proxies the stats/dashboard
  #  UI at http://headroom.localhost (edge net). Prometheus scrapes /metrics
  #  (monitoring net).
  # ---------------------------------------------------------------------------
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8787"
      - "--backend"
      - "openrouter"
      - "--budget"
      - "${HEADROOM_DAILY_BUDGET:-0}"
    environment:
      # Must match the provider Hermes is configured to use.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # For direct providers instead of OpenRouter:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # LLMLingua ML compression (optional — adds ~2GB RAM, 10-30s cold start):
      # - HEADROOM_LLMLINGUA=${HEADROOM_LLMLINGUA:-}
      # - HEADROOM_LLMLINGUA_DEVICE=${HEADROOM_LLMLINGUA_DEVICE:-cpu}
      - HEADROOM_TELEMETRY=${HEADROOM_TELEMETRY:-false}
      - HEADROOM_LOG_LEVEL=${HEADROOM_LOG_LEVEL:-INFO}
    ports:
      # Bind localhost-only — Caddy and internal Docker traffic use named networks.
      # Expose for direct /stats, /dashboard, /metrics access on the host.
      - "127.0.0.1:8787:8787"
    networks: [agent, edge, monitoring]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${HEADROOM_MEM_LIMIT:-512M}
          cpus: "${HEADROOM_CPU_LIMIT:-0.5}"

  # ---------------------------------------------------------------------------
  #  Hindsight database — external PostgreSQL + pgvector
  #  Replaces Hindsight's embedded pg0 instance so memory data survives
  #  container recreation and gets the same backup/monitoring treatment as
  #  Windmill's db.
  # ---------------------------------------------------------------------------
  hindsight_db:
    image: pgvector/pgvector:pg16
    container_name: hindsight_db
    restart: unless-stopped
    volumes:
      - ${HINDSIGHT_DB_DATA_DIR:-./data/hindsight/db}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:-hindsight}
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HINDSIGHT_DB_USER:-hindsight}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [memory]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Hindsight — personal second-brain memory
  #  API server + web UI, backed by the external `hindsight_db` PostgreSQL
  #  service above (pgvector extension) instead of the embedded pg0.
  #  API on 8888, web UI (memory browser) on 9999.
  #  LLM is used for fact extraction and reflect synthesis — points at LM Studio.
  # ---------------------------------------------------------------------------
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    depends_on:
      hindsight_db:
        condition: service_healthy
    environment:
      # ── Database (external PostgreSQL + pgvector, replaces embedded pg0) ──
      - HINDSIGHT_API_DATABASE_URL=postgresql://${HINDSIGHT_DB_USER:-hindsight}:${HINDSIGHT_DB_PASSWORD:-hindsight}@hindsight_db:5432/${HINDSIGHT_DB_NAME:-hindsight}
      # ── Primary LLM ────────────────────────────────────────────────────────
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_LLM_API_KEY:-openai}
      - HINDSIGHT_API_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL:-http://ollama:11434/v1}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL:-qwen2.5:14b}
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER:-openai}
      - HINDSIGHT_API_LLM_RESPONSE_FORMAT=${HINDSIGHT_LLM_RESPONSE_FORMAT:-json_schema}
      # Grammar-enforce structured output via the provider's strongest schema
      # mode. Some OpenAI-compatible backends (e.g. LM Studio) reject the
      # soft `json_object` fallback outright (400: response_format.type must
      # be 'json_schema' or 'text'), so this must be true for those backends.
      - HINDSIGHT_API_LLM_STRICT_SCHEMA=${HINDSIGHT_LLM_STRICT_SCHEMA:-true}
      - HINDSIGHT_API_LLM_TIMEOUT=${HINDSIGHT_API_LLM_TIMEOUT:-8400}
      - HINDSIGHT_API_LLM_MAX_CONCURRENT=${HINDSIGHT_LLM_MAX_CONCURRENT:-1}
      - HINDSIGHT_API_LLM_REASONING_EFFORT=${HINDSIGHT_LLM_REASONING_EFFORT:-low}
      # ── Per-operation LLM overrides ────────────────────────────────────────
      - HINDSIGHT_API_RETAIN_LLM_PROVIDER=${HINDSIGHT_RETAIN_LLM_PROVIDER:-}
      - HINDSIGHT_API_RETAIN_LLM_API_KEY=${HINDSIGHT_RETAIN_LLM_API_KEY:-}
      - HINDSIGHT_API_RETAIN_LLM_MODEL=${HINDSIGHT_RETAIN_LLM_MODEL:-}
      - HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER=${HINDSIGHT_CONSOLIDATION_LLM_PROVIDER:-}
      - HINDSIGHT_API_CONSOLIDATION_LLM_API_KEY=${HINDSIGHT_CONSOLIDATION_LLM_API_KEY:-}
      - HINDSIGHT_API_CONSOLIDATION_LLM_MODEL=${HINDSIGHT_CONSOLIDATION_LLM_MODEL:-}
      - HINDSIGHT_API_REFLECT_LLM_PROVIDER=${HINDSIGHT_REFLECT_LLM_PROVIDER:-}
      - HINDSIGHT_API_REFLECT_LLM_API_KEY=${HINDSIGHT_REFLECT_LLM_API_KEY:-}
      - HINDSIGHT_API_REFLECT_LLM_MODEL=${HINDSIGHT_REFLECT_LLM_MODEL:-}
      # ── Retain pipeline ────────────────────────────────────────────────────
      - HINDSIGHT_API_RETAIN_EXTRACTION_MODE=${HINDSIGHT_RETAIN_EXTRACTION_MODE:-concise}
      - HINDSIGHT_API_RETAIN_CHUNK_SIZE=${HINDSIGHT_RETAIN_CHUNK_SIZE:-3000}
      - HINDSIGHT_API_RETAIN_EXTRACT_CAUSAL_LINKS=${HINDSIGHT_RETAIN_EXTRACT_CAUSAL_LINKS:-true}
      - HINDSIGHT_API_RETAIN_MAX_CONCURRENT=${HINDSIGHT_RETAIN_MAX_CONCURRENT:-1}
      - HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS=${HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS:-4096}
      # ── Embeddings ─────────────────────────────────────────────────────────
      - HINDSIGHT_API_EMBEDDINGS_PROVIDER=${HINDSIGHT_EMBEDDINGS_PROVIDER:-local}
      - HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL=${HINDSIGHT_EMBEDDINGS_LOCAL_MODEL:-BAAI/bge-small-en-v1.5}
      # ── Reranker ───────────────────────────────────────────────────────────
      - HINDSIGHT_API_RERANKER_PROVIDER=${HINDSIGHT_RERANKER_PROVIDER:-local}
      - HINDSIGHT_API_RERANKER_LOCAL_MODEL=${HINDSIGHT_RERANKER_LOCAL_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - HINDSIGHT_API_RERANKER_LOCAL_MAX_CONCURRENT=${HINDSIGHT_RERANKER_MAX_CONCURRENT:-4}
      - HINDSIGHT_API_RERANKER_MAX_CANDIDATES=${HINDSIGHT_RERANKER_MAX_CANDIDATES:-300}
      # ── Retrieval ──────────────────────────────────────────────────────────
      - HINDSIGHT_API_SEMANTIC_MIN_SIMILARITY=${HINDSIGHT_SEMANTIC_MIN_SIMILARITY:-0.3}
      - HINDSIGHT_API_RECALL_MAX_CONCURRENT=${HINDSIGHT_RECALL_MAX_CONCURRENT:-32}
      # ── Server ─────────────────────────────────────────────────────────────
      - HINDSIGHT_API_WORKERS=${HINDSIGHT_WORKERS:-1}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      # ── Worker slot control ────────────────────────────────────────────
      - HINDSIGHT_API_WORKER_ID=${HINDSIGHT_API_WORKER_ID:-hindsight-worker-1}
      - HINDSIGHT_API_WORKER_MAX_SLOTS=${HINDSIGHT_API_WORKER_MAX_SLOTS:-3}
      - HINDSIGHT_API_WORKER_CONSOLIDATION_MAX_SLOTS=${HINDSIGHT_API_WORKER_CONSOLIDATION_MAX_SLOTS:-1}
      - HINDSIGHT_API_WORKER_RETAIN_MAX_SLOTS=${HINDSIGHT_API_WORKER_RETAIN_MAX_SLOTS:-1}
      - HINDSIGHT_API_LOG_LEVEL=${HINDSIGHT_LOG_LEVEL:-INFO}
      - HINDSIGHT_API_WORKER_POLL_INTERVAL_MS=${HINDSIGHT_API_WORKER_POLL_INTERVAL_MS:-1000}
    volumes:
      - ${HINDSIGHT_CACHE_DIR:-./data/hindsight/cache}:/home/hindsight/.cache
    ports:
      - "${HINDSIGHT_BIND:-127.0.0.1}:${HINDSIGHT_API_PORT:-8888}:8888"   # REST API
      - "${HINDSIGHT_BIND:-127.0.0.1}:${HINDSIGHT_UI_PORT:-9999}:9999"    # Web UI
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach LM Studio on the host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${HINDSIGHT_MEM_LIMIT:-2G}
          cpus: "${HINDSIGHT_CPU_LIMIT:-1.0}"
    networks: [memory, inference, edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Ollama — local LLM inference server (OpenAI-compatible API at /v1)
  #  Models are stored in OLLAMA_DATA_DIR (can be several GB each).
  #  Pull a model after first start:
  #    docker exec ollama ollama pull llama3.2
  #
  #  NVIDIA GPU support: requires nvidia-container-toolkit on the host.
  #  Uncomment the `reservations` block under deploy.resources and restart.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      # Listen on all interfaces so Docker-networked services can reach it.
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-8}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      # Disable Intel iGPU detection — 2 GB VRAM limits it to <3B models;
      # CPU path with AVX_VNNI handles larger models more reliably.
      - OLLAMA_INTEL_GPU=${OLLAMA_INTEL_GPU:-0}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      - OLLAMA_VULKAN=${OLLAMA_VULKAN:-false}
      # Device visibility — blank = CPU only. Set CUDA_VISIBLE_DEVICES=0 (or
      # comma-separated indices) and uncomment the GPU reservations block below
      # to hand a specific GPU to Ollama.
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
      - GGML_VK_VISIBLE_DEVICES=${GGML_VK_VISIBLE_DEVICES:-}
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-}
      - GPU_DEVICE_ORDINAL=${GPU_DEVICE_ORDINAL:-}
      - ROCR_VISIBLE_DEVICES=${ROCR_VISIBLE_DEVICES:-}
      # ── Prompt / History ───────────────────────────────────────
      - OLLAMA_NOHISTORY=${OLLAMA_NOHISTORY:-false}
      - OLLAMA_NOPRUNE=${OLLAMA_NOPRUNE:-false}
      # Flash attention — beneficial for hybrid architectures (e.g. lfm2).
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-true}
      # q8_0 halves KV-cache RAM with minimal quality loss on CPU inference.
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # ── GPU layer offloading ────────────────────────────────────────────────
      # OLLAMA_NUM_GPU: layers to offload to GPU (0 = CPU only, auto = detect).
      # Pair with CUDA_VISIBLE_DEVICES / HIP_VISIBLE_DEVICES above.
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-0}
      # OLLAMA_MAX_VRAM: hard cap on VRAM bytes (prevents taking all GPU memory).
      # Example: 6442450944 = 6 GB. Leave blank for no cap (auto).
      - OLLAMA_MAX_VRAM=${OLLAMA_MAX_VRAM:-}
      # OLLAMA_LOAD_TIMEOUT: how long to wait for a stalled model load.
      - OLLAMA_LOAD_TIMEOUT=${OLLAMA_LOAD_TIMEOUT:-5m}
    volumes:
      - ${OLLAMA_DATA_DIR:-./data/ollama}:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM_LIMIT:-32G}
          cpus: "${OLLAMA_CPU_LIMIT:-8.0}"
        # Uncomment for NVIDIA GPU support (requires nvidia-container-toolkit):
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]
    networks: [inference, edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: windmill_db
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${WM_DB_PASSWORD:-windmill}
      POSTGRES_DB: windmill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill server
  # ---------------------------------------------------------------------------
  windmill_server:
    image: *wm-image
    pull_policy: always
    container_name: windmill_server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://postgres:${WM_DB_PASSWORD:-windmill}@db/windmill?sslmode=disable
      - MODE=server
      - BASE_URL=${WM_BASE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/logs:/tmp/windmill/logs
      - ${SHARED_DIR:-./data/shared}:/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/version || wget -qO- http://localhost:8000/api/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [backend, edge, agent]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill LSP (editor intellisense — proxied at /ws/*)
  # ---------------------------------------------------------------------------
  windmill_lsp:
    image: ${WM_LSP_IMAGE:-ghcr.io/windmill-labs/windmill-lsp:latest}
    pull_policy: always
    container_name: windmill_lsp
    restart: unless-stopped
    environment:
      - WINDMILL_BASE_URL=http://windmill_server:8000
    volumes:
      - ${WM_LSP_CACHE_DIR:-./data/windmill/lsp_cache}:/pyls/.cache
    networks: [edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill worker Python cache healer — runs once per `docker compose up`,
  #  before any worker starts. uv's managed-Python install into the shared
  #  cache is not crash-safe: a worker killed mid-extraction (or two replicas
  #  racing on a brand-new interpreter) leaves a half-extracted `cpython-*`
  #  dir that uv will not repair on its own, so every Python job then fails
  #  with "Couldn't locate the interpreter" until someone manually deletes it.
  #  This container validates every cached interpreter actually runs, deletes
  #  any that don't, and (re)installs 3.12 if missing — serially, before the
  #  worker replicas race on it themselves.
  # ---------------------------------------------------------------------------
  windmill_cache_init:
    image: *wm-image
    pull_policy: always
    container_name: windmill_cache_init
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        CACHE=/tmp/windmill/cache/py_runtime
        mkdir -p "$$CACHE"
        for d in "$$CACHE"/cpython-*; do
          [ -d "$$d" ] || continue
          ver=$$(basename "$$d" | sed -E 's/^cpython-([0-9]+\.[0-9]+)\..*/\1/')
          bin="$$d/bin/python$$ver"
          if [ ! -x "$$bin" ] || ! "$$bin" --version >/dev/null 2>&1; then
            echo "✗ repairing corrupt interpreter: $$(basename "$$d")"
            rm -rf "$$d"
          fi
        done
        if ! ls "$$CACHE"/cpython-3.12.* >/dev/null 2>&1; then
          echo "→ installing Python 3.12 into shared worker cache"
          UV_PYTHON_INSTALL_DIR="$$CACHE" uv python install 3.12
        fi
        echo "✓ worker Python cache healthy"
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/cache:/tmp/windmill/cache
    networks: [backend]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill workers (default group) — privileged, so capped
  # ---------------------------------------------------------------------------
  windmill_worker:
    image: *wm-image
    pull_policy: always
    restart: unless-stopped
    privileged: true
    init: true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 512M
    environment:
      - DATABASE_URL=postgres://postgres:${WM_DB_PASSWORD:-windmill}@db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=default
      - FAVOR_UNSHARE_PID=true
    depends_on:
      db:
        condition: service_healthy
      windmill_cache_init:
        condition: service_completed_successfully
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/cache:/tmp/windmill/cache
      - ${WM_DATA_DIR:-./data/windmill}/logs:/tmp/windmill/logs
      - ${SHARED_DIR:-./data/shared}:/shared
    networks: [backend, agent, inference]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Windmill native worker (lightweight, in-process jobs)
  # ---------------------------------------------------------------------------
  windmill_worker_native:
    image: *wm-image
    pull_policy: always
    container_name: windmill_worker_native
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
        reservations:
          memory: 256M
    environment:
      - DATABASE_URL=postgres://postgres:${WM_DB_PASSWORD:-windmill}@db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=native
      - NATIVE_MODE=true
      - SLEEP_QUEUE=200
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${WM_DATA_DIR:-./data/windmill}/logs:/tmp/windmill/logs
      - ${SHARED_DIR:-./data/shared}:/shared
    networks: [backend, agent, inference]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Observability — Prometheus + Grafana + exporters
  #
  #  Dashboards at http://grafana.localhost (admin / see GRAFANA_ADMIN_PASSWORD)
  #  Raw metrics at http://prometheus.localhost
  #
  #  Recommended community dashboard IDs to import in Grafana:
  #    193  — cAdvisor (container metrics)
  #    1860 — Node Exporter Full (host metrics)
  #    9628 — PostgreSQL Database
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/prometheus:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks: [monitoring, edge]
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-latest}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.localhost
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [monitoring, edge]
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-latest}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --disable_metrics=advtcp,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
    networks: [monitoring]
    logging: *default-logging

  node_exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-latest}
    container_name: node_exporter
    restart: unless-stopped
    command:
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.diskstats
      - --collector.filesystem
      - --collector.loadavg
      - --collector.meminfo
      - --collector.netdev
      - --collector.uname
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [monitoring]
    logging: *default-logging

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-latest}
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${WM_DB_PASSWORD:-windmill}@db/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [backend, monitoring]
    logging: *default-logging

  hindsight_postgres_exporter:
    image: prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-latest}
    container_name: hindsight_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${HINDSIGHT_DB_USER:-hindsight}:${HINDSIGHT_DB_PASSWORD:-hindsight}@hindsight_db:5432/${HINDSIGHT_DB_NAME:-hindsight}?sslmode=disable
    depends_on:
      hindsight_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    networks: [memory, monitoring]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Alertmanager — receives alerts fired by prometheus/alert.rules.yml and
  #  routes them to a notification channel (none configured by default — see
  #  alertmanager/alertmanager.yml). UI at http://alertmanager.localhost.
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-latest}
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/alertmanager:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    networks: [monitoring, edge]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Loki — log storage. Filesystem-backed, single-binary mode. Retention is
  #  set via LOKI_RETENTION_PERIOD in .env (see loki/loki-config.yml). Queried
  #  from Grafana's Explore tab via the Loki datasource — no Caddy route,
  #  nothing here is meant to be browsed directly.
  #  No healthcheck: the image is distroless (no shell/wget/curl), so an
  #  HTTP-based check can never succeed. Promtail depends on service_started
  #  only and retries pushes on its own until Loki's ingester is ready.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-latest}
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-720h}
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${MONITORING_DATA_DIR:-./data/monitoring}/loki:/loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks: [monitoring]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  #  Promtail — discovers every running container via the Docker socket and
  #  ships its logs to Loki. No log-dir bind mount needed (Docker SD reads via
  #  the daemon API), but it does need read access to the socket itself.
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-latest}
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    networks: [monitoring]
    logging: *default-logging