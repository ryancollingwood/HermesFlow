# =============================================================================
#  Hermes MCP config snippet — Cognee memory layer
#  Merge this into ~/.hermes/config.yaml under the `mcp_servers:` key.
#
#  Cognee exposes an MCP-compatible SSE endpoint when running in the stack.
#  Hermes will discover these tools at startup and register them alongside
#  its built-in toolset.
#
#  Available tools after connection:
#    cognee_add    — ingest text/documents into memory
#    cognee_search — semantic search across all memory
#    cognee_status — check what's been ingested
# =============================================================================

mcp_servers:
  cognee:
    # SSE transport — Cognee runs as a persistent service in the stack.
    # Use the internal Docker network name when Hermes is also containerised,
    # or localhost if running Hermes on the host.
    url: "http://cognee:8686/mcp/sse"          # container-to-container
    # url: "http://localhost:8686/mcp/sse"      # host-to-container alternative
    headers:
      Authorization: "Bearer ${COGNEE_API_KEY}"
    tools:
      include:
        - cognee_add       # ingest: notes, meeting summaries, documents
        - cognee_search    # retrieve: semantic search across all memory
        - cognee_status    # introspect: what's been ingested
      # cognee_delete and cognee_prune are excluded — destructive ops
      # should be run manually, not handed to the agent.
