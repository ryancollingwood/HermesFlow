global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Container-level CPU / memory / network / disk per container
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Host-level CPU / memory / disk / network
  - job_name: node_exporter
    static_configs:
      - targets: ['node_exporter:9100']

  # Windmill PostgreSQL metrics
  - job_name: postgres_exporter
    static_configs:
      - targets: ['postgres_exporter:9187']

  # Hindsight PostgreSQL metrics
  - job_name: hindsight_postgres_exporter
    static_configs:
      - targets: ['hindsight_postgres_exporter:9187']

  # Headroom context-compression proxy — token savings and request stats
  - job_name: headroom
    static_configs:
      - targets: ['headroom:8787']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: promtail
    static_configs:
      - targets: ['promtail:9080']
