# HermesFlow capability catalogue — version-controlled, repo-only (not synced
# to the Windmill server; outside wmill.yaml's scope, like wmill.yaml itself).
#
# Validated and loaded by f/hermes_flow/catalogue/models.py (load_catalogue).
# CI (windmill/tests/test_catalogue.py) fails if this file doesn't parse, an
# entry is malformed, two entries share a path, or an entry's path doesn't
# correspond to a real script/flow under windmill/f/.
#
# Deliberately small right now: these are the first two entries, covering
# capabilities that already exist. Cataloguing the rest of windmill/f/ is
# incremental follow-up work, not something this file needs to do all at
# once — an empty or partial catalogue is valid (see the empty-catalogue
# test case).
schema_version: "1.0"
entries:
  - kind: script
    tags: [hermes, connectivity, diagnostics]
    inputs_summary: >-
      conn: a hermes_endpoint resource (base_url + api_key) identifying
      which Hermes gateway to call. No other arguments.
    outputs_summary: >-
      List of model ids the gateway serves. Used as a connectivity check;
      f.hermes.client also exposes chat() for single completions when
      imported directly, though only main()'s own signature is catalogued
      here.
    input_kinds: [resource:hermes_endpoint]
    output_kinds: [model_list]
    metadata:
      path: f/hermes/client
      capability_version: "1.0.0"
      summary: Connectivity check against the Hermes gateway; lists the models it serves.
      maturity: stable
      owners: [platform]
      test_requirements: [contracts/hermes-client-response, smoke/hermes-client-live]
      scheduled_health:
        enabled: true
        cron: "0 17 * * * *"
        timezone: UTC
        max_samples_per_run: 1
        max_data_bytes: 65536
        max_timeout_seconds: 30
        rate_limit_per_minute: 1
        escalate_after_failures: 3
      effects:
        network: true

  - kind: script
    tags: [repair, ai, candidate, provenance, policy, source-drift]
    inputs_summary: >-
      A complete HF-029 RepairContext, Hermes endpoint resource, versioned
      capability catalogue, model controls, and minimal-change limits.
    outputs_summary: >-
      A repair-generation result containing either an isolated candidate and
      patch validation or a retained, attributable rejection with exact
      prompt, context, raw-output, and parsed-output artifacts.
    input_kinds: [repair_context, resource:hermes_endpoint, capability_catalogue]
    output_kinds: [repair_generation_result, candidate_record, artifact_refs]
    metadata:
      path: f/hermes_flow/repair/generate_candidate
      capability_version: "1.0.0"
      summary: Generate a minimal policy-checked repair candidate from a failed active script without mutating it.
      maturity: experimental
      deterministic: false
      owners: [platform]
      dependencies:
        - f/hermes_flow/repair/models
        - f/hermes_flow/catalogue/models
        - f/hermes_flow/candidate_ops/create
        - f/libraries/ai/invoke_hermes_structured
        - f/libraries/lineage/models
        - f/libraries/storage/artifacts
      test_requirements: [contracts/repair-generation-result]
      limits:
        timeout_seconds: 300
        max_concurrency: 2
        rate_limit_per_minute: 10
      effects:
        network: true
        filesystem: true

  - kind: script
    tags: [data-platform, extract, hacker-news, dlt]
    inputs_summary: >-
      limit: optional integer, number of top stories to fetch (default 20).
    outputs_summary: >-
      Writes immutable raw Parquet rows to
      /shared/datalake/hn_stories/<date>/ via the dlt pipeline in
      data-platform/dlt/pipelines/hn_stories.py; returns the dlt run's
      LoadInfo summary (row/table counts), not the story data itself.
    input_kinds: []
    output_kinds: [parquet:hn_stories, dlt_load_info]
    metadata:
      path: f/data_platform/extract_hn_stories
      capability_version: "1.0.0"
      summary: Extract Hacker News top stories via dlt into the immutable Parquet datalake.
      maturity: stable
      owners: [data-platform]
      effects:
        network: true
        filesystem: true

  - kind: script
    tags: [ai, hermes, structured-output, nondeterministic]
    inputs_summary: >-
      conn: a hermes_endpoint resource; task_prompt: required instructions;
      conversation: prior messages; input_payload: JSON-compatible task data;
      output_schema: a valid JSON Schema; optional model, sampling, token and
      retry bounds.
    outputs_summary: >-
      A StructuredInvocationResult containing schema-validated parsed output,
      model parameters and usage, visible per-attempt failures, retained
      artifact references, and lineage state.
    input_kinds: [resource:hermes_endpoint, json, json_schema]
    output_kinds: [structured_invocation_result, artifact_refs]
    metadata:
      path: f/libraries/ai/invoke_hermes_structured
      capability_version: "1.0.0"
      summary: Invoke Hermes with a JSON Schema contract and retain redacted lineage artifacts.
      maturity: experimental
      deterministic: false
      owners: [platform]
      dependencies: [f/hermes/client]
      effects:
        network: true
        filesystem: true

  - kind: script
    tags: [web, fetch, http, html, json, ssrf-safe]
    inputs_summary: >-
      url and allowed_domains are required; optional request headers, timeout,
      response-size limit, retry count, and redirect limit bound the fetch.
    outputs_summary: >-
      Structured HTTP status, safe response-header summary, retry/redirect
      evidence, and a lineage-linked raw response artifact reference.
    input_kinds: [url, domain_allowlist]
    output_kinds: [raw_http_artifact, http_response_metadata]
    metadata:
      path: f/capabilities/collection/web_fetch
      capability_version: "1.0.0"
      summary: Fetch an allowed public HTTP(S) resource with SSRF, retry, timeout, and size controls.
      maturity: experimental
      owners: [platform]
      test_requirements: [smoke/web-fetch-live]
      limits:
        timeout_seconds: 300
        rate_limit_per_minute: 60
      effects:
        network: true
        filesystem: true

  - kind: script
    tags: [web, extract, json-ld, schema-org, deterministic]
    inputs_summary: >-
      A retained raw HTTP ArtifactRef, with optional lineage verification and
      explicit bounds for source bytes, JSON-LD block bytes, blocks, and candidates.
    outputs_summary: >-
      Deterministically ordered, validated structured candidates with stable IDs,
      source artifact/block/path provenance, counts, and isolated parse warnings.
    input_kinds: [raw_http_artifact]
    output_kinds: [structured_candidates, extraction_provenance]
    metadata:
      path: f/capabilities/collection/extract_structured_markup
      capability_version: "1.0.0"
      summary: Deterministically extract validated JSON-LD candidates from retained web resources.
      maturity: experimental
      deterministic: true
      owners: [platform]
      dependencies: [f/capabilities/collection/web_fetch]
      test_requirements: [contracts/structured-markup-result]
      effects:
        filesystem: true

  - kind: flow
    tags: [product, collection, workflow, ecommerce, deterministic-first, bounded]
    inputs_summary: >-
      One to twenty explicitly allowlisted product source URLs, the collection_db
      PostgreSQL resource, optional per-source parser metadata, and bounded fetch,
      concurrency, retry, size, and product-count controls. Hermes AI fallback is
      disabled unless explicitly enabled with a hermes_endpoint resource.
    outputs_summary: >-
      A versioned ProductCollectionWorkflowResult with isolated per-source outcomes,
      retained raw and normalized artifacts, persistence evidence, deterministic
      comparison data, final report, complete lineage, capability versions, and the
      Windmill job reference.
    input_kinds: [product_sources, resource:postgresql, resource:hermes_endpoint]
    output_kinds: [product_collection_workflow_result, artifact_refs, execution_result]
    metadata:
      path: f/workflows/product_collection
      capability_version: "1.0.0"
      summary: Collect, extract, normalise, persist, compare, and report products from bounded sources.
      maturity: experimental
      deterministic: false
      owners: [platform]
      dependencies:
        - f/capabilities/collection/web_fetch
        - f/capabilities/collection/extract_products
        - f/capabilities/collection/normalise_products
        - f/capabilities/collection/product_snapshot_write
        - f/capabilities/collection/compare_product_snapshots
        - f/capabilities/collection/render_product_report
      test_requirements:
        - contracts/product-collection-workflow-result
        - smoke/product-collection-fixtures
        - live/product-collection-approved
      limits:
        timeout_seconds: 300
        max_concurrency: 8
        rate_limit_per_minute: 20
      effects:
        network: true
        database: true
        filesystem: true

  - kind: script
    tags: [product, extract, ecommerce, deterministic-first, ai-fallback]
    inputs_summary: >-
      A retained raw HTTP ArtifactRef plus optional source metadata and lineage;
      an optional hermes_endpoint enables schema-validated fallback after
      structured-markup and known deterministic parsers find no product.
    outputs_summary: >-
      Validated, deduplicated product records preserving source-form commerce
      fields, extraction/evidence provenance, attempted methods, and partial warnings.
    input_kinds: [raw_http_artifact, resource:hermes_endpoint]
    output_kinds: [extracted_products, extraction_provenance]
    metadata:
      path: f/capabilities/collection/extract_products
      capability_version: "1.0.0"
      summary: Extract products through JSON-LD, known page parsers, then schema-validated Hermes fallback.
      maturity: experimental
      deterministic: false
      owners: [platform]
      dependencies:
        - f/capabilities/collection/web_fetch
        - f/capabilities/collection/extract_structured_markup
        - f/libraries/ai/invoke_hermes_structured
      test_requirements: [contracts/product-extraction-result]
      effects:
        network: true
        filesystem: true

  - kind: script
    tags: [product, normalise, ecommerce, deterministic, schema]
    inputs_summary: >-
      A validated HF-023 ProductExtractionResult containing source-form product
      and offer records, or an already-normalised HF-024 result for idempotent validation.
    outputs_summary: >-
      Versioned common product records with canonical text and identifiers,
      locale-aware decimal amounts, explicit currency/availability/missing-value
      statuses, retained originals, and extraction provenance.
    input_kinds: [extracted_products]
    output_kinds: [normalized_products]
    metadata:
      path: f/capabilities/collection/normalise_products
      capability_version: "1.0.0"
      summary: Deterministically normalise extracted commerce records into a versioned common schema.
      maturity: experimental
      deterministic: true
      owners: [platform]
      dependencies: [f/capabilities/collection/extract_products]
      test_requirements: [contracts/product-normalization-result]
      effects: {}

  - kind: script
    tags: [product, snapshot, persistence, postgres, idempotent]
    inputs_summary: >-
      A validated HF-024 ProductNormalizationResult, an HF-018 execution
      context, the collection_db PostgreSQL resource, and an optional preview flag.
    outputs_summary: >-
      Per-product planned/inserted/updated/unchanged dispositions and stable payload hashes,
      with execution trace and source artifact identifiers; preview performs no writes.
    input_kinds: [normalized_products, execution_context, resource:postgresql]
    output_kinds: [product_snapshot_write_result]
    metadata:
      path: f/capabilities/collection/product_snapshot_write
      capability_version: "1.0.0"
      summary: Transactionally upsert normalized product snapshots using execution/source/product idempotency keys.
      maturity: experimental
      deterministic: false
      owners: [platform]
      dependencies:
        - f/capabilities/collection/normalise_products
        - f/libraries/lineage/models
      test_requirements: [contracts/product-snapshot-write-result]
      limits:
        timeout_seconds: 60
        max_concurrency: 4
      effects:
        database: true

  - kind: script
    tags: [product, snapshot, compare, postgres, deterministic-rules]
    inputs_summary: >-
      The collection_db PostgreSQL resource plus labelled HF-025 execution
      trace selections whose persisted product snapshots should be compared.
    outputs_summary: >-
      A versioned comparison dataset with source coverage, deduplicated product
      groups, same-currency price differences, counts, and structured warnings.
    input_kinds: [resource:postgresql, execution_trace_ids]
    output_kinds: [product_comparison_dataset]
    metadata:
      path: f/capabilities/collection/compare_product_snapshots
      capability_version: "1.0.0"
      summary: Load selected persisted snapshots and apply documented deterministic product and price comparison rules.
      maturity: experimental
      deterministic: false
      owners: [platform]
      dependencies:
        - f/capabilities/collection/product_snapshot_write
        - f/capabilities/collection/normalise_products
      test_requirements: [contracts/product-comparison-result]
      limits:
        timeout_seconds: 60
      effects:
        database: true

  - kind: script
    tags: [product, report, markdown, artifacts, result-envelope]
    inputs_summary: >-
      An HF-026 comparison dataset, HF-018 lineage and execution context,
      and the Windmill job reference proving the reporting run.
    outputs_summary: >-
      A machine-readable dataset artifact, final Markdown report artifact,
      updated lineage state, and standard ExecutionResult linking both artifacts and the job.
    input_kinds: [product_comparison_dataset, execution_context, artifact_lineage, windmill_job_ref]
    output_kinds: [product_report_result, artifact_refs, execution_result]
    metadata:
      path: f/capabilities/collection/render_product_report
      capability_version: "1.0.0"
      summary: Render and retain a human-readable product comparison report with raw-source lineage and job evidence.
      maturity: experimental
      deterministic: false
      owners: [platform]
      dependencies:
        - f/capabilities/collection/compare_product_snapshots
        - f/libraries/lineage/helpers
        - f/libraries/results/models
        - f/libraries/storage/artifacts
      test_requirements: [contracts/product-report-result]
      effects:
        filesystem: true

  - kind: script
    tags: [repair, failure, inspection, diagnostics, redaction, bounded]
    inputs_summary: >-
      A failed Windmill job ID, the versioned capability catalogue, optional
      recent test evidence, public Windmill base URL, and a serialized-size bound.
    outputs_summary: >-
      A versioned RepairContext linking the original job and containing bounded,
      redacted active code, inputs, logs, artifact references, dependency impact,
      relevant recent tests, deterministic failure classification, and explicit
      redaction/truncation evidence.
    input_kinds: [windmill_job_ref, capability_catalogue, test_evidence]
    output_kinds: [repair_context]
    metadata:
      path: f/hermes_flow/repair/inspection
      capability_version: "1.0.0"
      summary: Gather and classify a bounded, credential-safe repair context for a failed Windmill job.
      maturity: experimental
      deterministic: true
      owners: [platform]
      dependencies:
        - f/hermes_flow/catalogue/models
        - f/hermes_flow/candidate_ops/diff
        - f/hermes_flow/repair/models
      test_requirements: [contracts/failure-inspection-context]
      limits:
        timeout_seconds: 60
        max_concurrency: 4
        rate_limit_per_minute: 30
      effects:
        network: true
