summary: Send a document to every allow-listed Telegram user
description: ''
lock: '!inline f/hermes/telegram.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    document_name:
      type: string
      description: Filename Telegram shows for the delivered document
      default: report.md
      originalType: string
    document_text:
      type: string
      description: Document contents to deliver
      default: null
      originalType: string
  required:
    - document_text
