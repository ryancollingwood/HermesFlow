summary: Promote an approved repair and retry its original execution once
description: Rechecks the active base version, promotes the tested candidate,
  reloads original arguments without persisting them, injects child lineage,
  submits one bounded retry, and records the linked outcome.
lock: '!inline f/hermes_flow/repair/finalize_retry.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    approval_granted:
      type: boolean
      default: null
    approved_by:
      type: string
      default: ''
      originalType: string
    context_argument:
      type: string
      default: context
      originalType: string
    prepared_json:
      type: string
      default: null
      originalType: string
    retry_timeout_seconds:
      type: integer
      default: 300
      maximum: 3600
      minimum: 1
  required:
    - prepared_json
    - approval_granted
