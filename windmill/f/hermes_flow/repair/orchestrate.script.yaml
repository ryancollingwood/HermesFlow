summary: Prepare a bounded adaptive repair for approval
description: Inspects and classifies the failed job, enforces repair policy and
  attempt limits, generates an isolated candidate, promotes source-drift
  fixtures, runs affected-consumer regressions, and prepares diff/impact/test
  evidence without changing active code.
lock: '!inline f/hermes_flow/repair/orchestrate.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    catalogue_yaml:
      type: string
      default: null
      originalType: string
    conn:
      type: object
      default: null
      properties: {}
    expected_behavior:
      type: object
      default: null
      properties: {}
    failed_job_id:
      type: string
      default: null
      originalType: string
    fixture_binding:
      type: object
      default: null
      properties: {}
    manifest_yaml:
      type: string
      default: null
      originalType: string
    max_attempts:
      type: integer
      default: 2
      maximum: 3
      minimum: 1
    original_context:
      type: object
      default: null
      properties: {}
    recent_test_evidence:
      type: array
      default: null
      items:
        type: object
      originalType: record[]
    sanitization_rules:
      type: object
      default: null
      properties: {}
    source_artifact:
      type: object
      default: null
      properties: {}
  required:
    - conn
    - failed_job_id
    - catalogue_yaml
    - manifest_yaml
    - original_context
